<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Lesson 5.2 — Quiz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 15px;
    overflow-x: hidden;
  }
  .app {
    background: #fff; border-radius: 24px; padding: 30px;
    width: 100%; max-width: 700px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.3);
    position: relative; overflow: hidden;
  }
  .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
  .close-btn {
    font-size: 24px; color: #afafaf; cursor: pointer; border: none;
    background: none; transition: transform .2s;
  }
  .close-btn:hover { transform: scale(1.2); color: #ff4b4b; }
  .progress-bar {
    flex: 1; height: 16px; background: #e5e5e5; border-radius: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #58cc02, #89e219);
    border-radius: 10px; transition: width .5s ease;
    box-shadow: 0 0 10px rgba(88,204,2,0.6);
  }
  .hearts { font-size: 20px; display: flex; gap: 3px; }
  .heart { transition: all .3s; }
  .heart.lost { opacity: .2; transform: scale(.7); }

  .stats { display: flex; justify-content: space-between; margin-bottom: 25px; font-size: 14px; color: #777; }
  .combo { color: #ff9600; font-weight: bold; font-size: 16px; }
  .combo.big { animation: pulse .5s ease; }
  @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.4)} 100%{transform:scale(1)} }

  .question-area { text-align: center; margin-bottom: 25px; }
  .question-label { font-size: 14px; color: #afafaf; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 600; }
  .question-text { font-size: 26px; font-weight: 700; color: #3c3c3c; margin-bottom: 8px; }
  .question-hint { font-size: 15px; color: #999; font-style: italic; }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 500px) { .answers { grid-template-columns: 1fr; } }

  .answer {
    padding: 18px 15px; border: 2px solid #e5e5e5; border-radius: 14px;
    background: #fff; cursor: pointer; font-size: 16px; font-weight: 600;
    color: #3c3c3c; transition: all .15s; text-align: left; position: relative;
    box-shadow: 0 4px 0 #e5e5e5;
  }
  .answer:hover:not(.disabled) { border-color: #58cc02; background: #f7fff0; transform: translateY(-2px); }
  .answer:active:not(.disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #e5e5e5; }
  .answer.correct { border-color: #58cc02; background: #d7ffb8; color: #3a7d00; box-shadow: 0 4px 0 #58cc02; animation: correctAnim .4s; }
  .answer.wrong { border-color: #ff4b4b; background: #ffdfe0; color: #cc0000; box-shadow: 0 4px 0 #ff4b4b; animation: shakeAnim .4s; }
  .answer.disabled { cursor: not-allowed; }
  @keyframes correctAnim { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }
  @keyframes shakeAnim { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .feedback {
    margin-top: 20px; padding: 15px; border-radius: 12px; font-weight: 600;
    display: none; animation: slideUp .3s ease;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: #d7ffb8; color: #3a7d00; border: 2px solid #58cc02; }
  .feedback.fail { background: #ffdfe0; color: #cc0000; border: 2px solid #ff4b4b; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .next-btn {
    width: 100%; margin-top: 15px; padding: 16px; border: none; border-radius: 14px;
    background: #58cc02; color: #fff; font-size: 17px; font-weight: 700;
    cursor: pointer; display: none; box-shadow: 0 4px 0 #46a302;
    transition: all .15s; text-transform: uppercase; letter-spacing: 1px;
  }
  .next-btn.show { display: block; animation: slideUp .3s ease; }
  .next-btn:hover { background: #6ee026; }
  .next-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #46a302; }

  /* START SCREEN */
  .start-screen, .end-screen { text-align: center; padding: 20px 10px; }
  .start-screen h1 { font-size: 32px; color: #58cc02; margin-bottom: 10px; }
  .start-screen p { color: #777; font-size: 16px; margin-bottom: 25px; line-height: 1.6; }
  .start-btn {
    padding: 18px 45px; border: none; border-radius: 16px;
    background: #58cc02; color: #fff; font-size: 20px; font-weight: 700;
    cursor: pointer; box-shadow: 0 5px 0 #46a302; transition: all .15s;
  }
  .start-btn:hover { background: #6ee026; transform: translateY(-2px); }
  .start-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #46a302; }
  .mascot { font-size: 80px; margin-bottom: 10px; animation: bounce 2s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

  /* END SCREEN */
  .end-screen h2 { font-size: 30px; margin-bottom: 10px; }
  .end-screen .big-emoji { font-size: 90px; margin-bottom: 15px; }
  .result-stats { display: flex; justify-content: center; gap: 25px; margin: 20px 0; flex-wrap: wrap; }
  .stat-box { background: #f7f7f7; padding: 15px 25px; border-radius: 14px; }
  .stat-box .num { font-size: 28px; font-weight: 800; color: #58cc02; }
  .stat-box .lbl { font-size: 13px; color: #999; text-transform: uppercase; }
  .restart-btn {
    padding: 16px 40px; border: none; border-radius: 16px;
    background: #58cc02; color: #fff; font-size: 18px; font-weight: 700;
    cursor: pointer; box-shadow: 0 5px 0 #46a302; margin-top: 15px;
  }
  .restart-btn:hover { background: #6ee026; }
  .restart-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #46a302; }

  /* Confetti */
  .confetti {
    position: fixed; width: 10px; height: 10px; top: -10px;
    animation: fall linear forwards; z-index: 999; pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

  </div>

    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">ПРОДОЛЖИТЬ</button>
  </div>

  <!-- END SCREEN -->
  <div id="endScreen" class="end-screen hidden">
    <div class="big-emoji" id="endEmoji">🏆</div>

    <div class="result-stats">

  { ru: "Вы это видите", en: "You see it", type: "en", wrong: ["You sees it", "You are see it", "You seeing it"] },
  { ru: "Он хочет это сделать", en: "He wants to do it", type: "en", wrong: ["He want to do it", "He wants do it", "He wanting to do it"] },
  { ru: "Она чувствует себя такой счастливой", en: "She feels so happy", type: "en", wrong: ["She feel so happy", "She feels so happily", "She feeling so happy"] },

  { ru: "У меня есть сестра", en: "I have a sister", type: "en", wrong: ["I has a sister", "I am have a sister", "I have sister a"] },
  { ru: "У него есть идея", en: "He has an idea", type: "en", wrong: ["He have an idea", "He has a idea", "He is have an idea"] },
  { ru: "У неё интересные идеи", en: "She has interesting ideas", type: "en", wrong: ["She have interesting ideas", "She has interesting idea", "She is have interesting ideas"] },
  { ru: "Я всё вижу", en: "I see everything", type: "en", wrong: ["I sees everything", "I am see everything", "I seeing everything"] },
  { ru: "Она очень много работает", en: "She works very hard", type: "en", wrong: ["She work very hard", "She works very hardly", "She working very hard"] },
  { ru: "Мой начальник обычно проверяет всю информацию", en: "My boss usually checks all the information", type: "en", wrong: ["My boss usually check all the information", "My boss check usually all information", "My boss usually checking all the information"] },

/* ============ СОСТОЯНИЕ ИГРЫ ============ */
const TOTAL_QUESTIONS = 20;
const MAX_LIVES = 3;
let state = {};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  // Берём 20 случайных вопросов из банка
  const selected = shuffle(QUESTIONS).slice(0, TOTAL_QUESTIONS);
  state = {
    questions: selected,
    index: 0,
    lives: MAX_LIVES,
    score: 0,
    combo: 0,
    maxCombo: 0,
    correctCount: 0,
    answered: false
  };
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  renderHearts();
  renderQuestion();
}

function renderHearts() {
  const el = document.getElementById('hearts');
  el.innerHTML = '';
  for (let i = 0; i < MAX_LIVES; i++) {
    const span = document.createElement('span');
    span.className = 'heart' + (i >= state.lives ? ' lost' : '');
    span.textContent = '❤️';
    el.appendChild(span);
  }
}

function renderQuestion() {
  state.answered = false;
  const q = state.questions[state.index];

  // Прогресс
  const pct = (state.index / TOTAL_QUESTIONS) * 100;
  document.getElementById('progressFill').style.width = pct + '%';

  // Счётчик
  document.getElementById('questionCounter').textContent =
    `Вопрос ${state.index + 1} / ${TOTAL_QUESTIONS}`;

  // Комбо
  const comboEl = document.getElementById('comboDisplay');
  comboEl.textContent = `🔥 Комбо: ${state.combo}`;

  // Вопрос
  document.getElementById('questionLabel').textContent = 'Переведите на английский';
  document.getElementById('questionText').textContent = q.ru;
  document.getElementById('questionHint').textContent = '';

  // Ответы: правильный + 3 неправильных, перемешанные
  const options = shuffle([q.en, ...q.wrong]);
  const answersEl = document.getElementById('answers');
  answersEl.innerHTML = '';

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(btn, opt, q.en);
    answersEl.appendChild(btn);
  });

  // Скрыть фидбек и кнопку "дальше"
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('nextBtn').textContent = 'ПРОДОЛЖИТЬ';
}

function selectAnswer(btn, chosen, correct) {
  if (state.answered) return;
  state.answered = true;

  const allBtns = document.querySelectorAll('.answer');
  allBtns.forEach(b => {
    b.classList.add('disabled');
    if (b.textContent === correct) b.classList.add('correct');
  });

  const fb = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');

  if (chosen === correct) {
    // ПРАВИЛЬНО
    btn.classList.add('correct');
    state.combo++;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;
    state.correctCount++;

    // Очки: базовые 10 + бонус за комбо
    const comboBonus = Math.min(state.combo * 2, 20);
    const points = 10 + comboBonus;
    state.score += points;

    // Анимация комбо
    const comboEl = document.getElementById('comboDisplay');
    comboEl.textContent = `🔥 Комбо: ${state.combo}`;
    if (state.combo >= 3) {
      comboEl.classList.add('big');
      setTimeout(() => comboEl.classList.remove('big'), 500);
    }

    fb.className = 'feedback ok show';
    fb.textContent = `✅ Правильно! +${points} очков` + (state.combo >= 3 ? ` 🔥 x${state.combo} комбо!` : '');
    nextBtn.textContent = 'ПРОДОЛЖИТЬ';
  } else {
    // НЕПРАВИЛЬНО
    btn.classList.add('wrong');
    state.combo = 0;
    state.lives--;

    document.getElementById('comboDisplay').textContent = `🔥 Комбо: 0`;

    fb.className = 'feedback fail show';
    fb.textContent = `❌ Неверно. Правильно: "${correct}"`;

    renderHearts();

    if (state.lives <= 0) {
      nextBtn.textContent = 'ПОСМОТРЕТЬ РЕЗУЛЬТАТ';
    }
  }

  nextBtn.classList.add('show');
}

function nextQuestion() {
  if (state.lives <= 0) {
    endGame();
    return;
  }
  state.index++;
  if (state.index >= TOTAL_QUESTIONS) {
    endGame();
    return;
  }
  renderQuestion();
}

function endGame() {
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');

  const pctCorrect = Math.round((state.correctCount / TOTAL_QUESTIONS) * 100);
  const endEmoji = document.getElementById('endEmoji');
  const endTitle = document.getElementById('endTitle');
  const endMsg = document.getElementById('endMessage');

  if (state.lives <= 0) {
    endEmoji.textContent = '💔';
    endTitle.textContent = 'Жизни закончились';
    endTitle.style.color = '#ff4b4b';
    endMsg.textContent = `Ты ответил правильно на ${state.correctCount} из ${TOTAL_QUESTIONS}. Попробуй ещё раз!`;
  } else if (pctCorrect >= 90) {
    endEmoji.textContent = '🏆';
    endTitle.textContent = 'Легенда!';
    endTitle.style.color = '#58cc02';
    endMsg.textContent = `Великолепно! ${pctCorrect}% правильных ответов. Ты мастер английского!`;
    fireConfetti();
  } else if (pctCorrect >= 70) {
    endEmoji.textContent = '🎉';
    endTitle.textContent = 'Отлично!';
    endTitle.style.color = '#58cc02';
    endMsg.textContent = `${pctCorrect}% правильных. Очень хороший результат!`;
    fireConfetti();
  } else if (pctCorrect >= 50) {
    endEmoji.textContent = '👍';
    endTitle.textContent = 'Неплохо!';
    endTitle.style.color = '#ff9600';
    endMsg.textContent = `${pctCorrect}% правильных. Есть куда расти!`;
  } else {
    endEmoji.textContent = '📚';
    endTitle.textContent = 'Нужно повторить';
    endTitle.style.color = '#ff9600';
    endMsg.textContent = `${pctCorrect}% правильных. Повтори урок и попробуй снова!`;
  }

  document.getElementById('finalScore').textContent = state.score;
  document.getElementById('finalCorrect').textContent = `${state.correctCount}/${TOTAL_QUESTIONS}`;
  document.getElementById('finalCombo').textContent = state.maxCombo;
}

function restartGame() {
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

/* ============ CONFETTI ============ */
function fireConfetti() {
  const colors = ['#58cc02', '#ff4b4b', '#ff9600', '#1cb0f6', '#ce82ff', '#ffd900'];
  for (let i = 0; i < 100; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.width = c.style.height = (6 + Math.random() * 8) + 'px';
    if (Math.random() > 0.5) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}
</script>
